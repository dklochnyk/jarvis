<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src ws://127.0.0.1:8765; img-src 'self' https://i.scdn.co data:; style-src 'self' 'unsafe-inline'">
<title>Jarvis</title>
<style>
  :root { --c: 0, 200, 255; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent;
               font-family: "Segoe UI", "Consolas", sans-serif; user-select: none; }
  #hud { position: fixed; inset: 0; transition: opacity .6s; }
  #hud.hidden { opacity: 0; }
  /* the core has a small canvas of its own that follows it, so the screen is never redrawn as a whole */
  canvas#c { position: fixed; left: 0; top: 0; pointer-events: none; }
  #stage { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; transform: translateZ(0); pointer-events: none; }   /* the home screen: fixed children are placed against it */
  #stage > .panel { pointer-events: auto; }
  #stage > #term { pointer-events: none; }
  #stage > #term.show { pointer-events: auto; }

  /* ---- panels: free-form, no boxes ---- */
  .panel { position: fixed; color: rgb(var(--c)); font-family: Consolas, monospace; font-size: 11px;
           letter-spacing: .12em; text-transform: uppercase; transition: opacity .5s; box-sizing: border-box; padding: 4px 6px;
           text-shadow: 0 0 5px rgba(0, 6, 14, .95), 0 0 12px rgba(0, 6, 14, .8), 0 0 9px rgba(var(--c), .45); }
  .ph { font-size: 10px; letter-spacing: .28em; opacity: .75; margin: -2px 0 8px; display: flex; align-items: center; gap: 8px; }
  .ph::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--c)); box-shadow: 0 0 8px rgb(var(--c)); }
  .ph::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(var(--c), .5), transparent); }
  .dim .panel { opacity: .6; }
  /* a window is open on this panel's screen: tuck it away (windows on other screens don't matter) */
  .panel.covered, .dim .panel.covered { opacity: 0 !important; pointer-events: none !important; }
  .panel.grab { outline: 1px dashed rgba(var(--c), .6); }

  /* performance hub */
  #perf { top: 14px; left: 28px; right: 28px; }
  #perfc { display: block; width: 100%; height: 92px; }
  #sysline { margin-top: 0; opacity: .6; display: flex; justify-content: space-between; }

  /* spotify player */
  #player { bottom: 36px; left: 28px; width: 500px; }
  #pl-top { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; }
  #pl-disc { position: relative; width: 150px; height: 150px; }
  #pl-rad { position: absolute; inset: 0; width: 150px; height: 150px; }
  #pl-art { position: absolute; left: 41px; top: 41px; width: 68px; height: 68px; }
  #pl-art img { position: absolute; inset: 0; width: 68px; height: 68px; border-radius: 50%; object-fit: cover; background: #06121e; border: 1px solid rgba(var(--c), .7); box-sizing: border-box; }
  #pl-art .hole { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px; border-radius: 50%; background: rgba(4, 12, 22, .9); border: 1px solid rgba(var(--c), .7); }
  #pl-label { font-size: 9px; letter-spacing: .3em; opacity: .75; }
  #pl-title { font-size: 17px; letter-spacing: .05em; color: #f0fdff; text-transform: none; margin: 3px 0 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
  #pl-artist { font-size: 12px; letter-spacing: .06em; text-transform: none; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
  #pl-ctl { display: flex; align-items: center; gap: 10px; margin: 10px 0 8px; }
  .pbtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(var(--c), .6); display: flex; align-items: center; justify-content: center; cursor: pointer;
          background: rgba(var(--c), .08); transition: background .15s, box-shadow .15s; }
  .pbtn.big { width: 42px; height: 42px; border-width: 1.5px; }
  .pbtn svg { width: 55%; height: 55%; fill: rgb(var(--c)); }
  .pbtn:hover { background: rgba(var(--c), .3); box-shadow: 0 0 14px rgba(var(--c), .7); }
  .pbtn:active { transform: scale(.92); }
  #pl-prog { display: flex; align-items: center; gap: 10px; font-size: 10px; opacity: .85; }
  #pl-bar { flex: 1; height: 3px; background: rgba(var(--c), .2); position: relative; }
  #pl-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgb(var(--c)); box-shadow: 0 0 8px rgb(var(--c)); }
  #pl-bar i::after { content: ""; position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgb(var(--c)); }
  #pl-spec { display: block; width: 488px; height: 78px; margin-top: 4px; }
  #player.off #pl-ctl { opacity: .3; pointer-events: none; }

  /* terminal + command box: appears when something goes wrong, or when you press Ctrl+Alt+T */
  #term { top: 28px; left: 50%; margin-left: -330px; width: 660px; text-transform: none; letter-spacing: .02em;
          opacity: 0; pointer-events: none; background: linear-gradient(180deg, rgba(4, 16, 28, .8), rgba(3, 10, 20, .7)); border: 1px solid rgba(var(--c), .3); padding: 10px 14px; }
  #term.show { opacity: 1; pointer-events: auto; }
  #term .ph { text-transform: uppercase; }
  #term .ph .cnt { margin-left: auto; letter-spacing: .12em; opacity: .8; }
  #term .ph .cnt.bad { color: #ff6a6a; opacity: 1; text-shadow: 0 0 8px #ff4d4d; }
  #tlines { max-height: 150px; overflow: hidden; font-size: 11px; line-height: 1.45; }
  #tlines div { white-space: pre-wrap; word-break: break-all; opacity: .82; }
  #tlines div.warn { color: #ffd166; opacity: 1; }
  #tlines div.err { color: #ff6a6a; opacity: 1; text-shadow: 0 0 6px rgba(255, 80, 80, .6), 0 0 10px rgba(0, 6, 14, .9); }
  #tprompt { display: flex; gap: 8px; align-items: center; margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(var(--c), .25); font-size: 12px; }
  #tprompt span { color: rgb(var(--c)); text-shadow: 0 0 8px rgb(var(--c)); }
  #tin { flex: 1; background: rgba(0, 8, 18, .55); border: 1px solid rgba(var(--c), .3); border-radius: 3px; outline: none; color: #dff6ff; font: inherit; padding: 4px 7px; text-transform: none; letter-spacing: .02em; }
  #tin:focus { border-color: rgba(var(--c), .9); box-shadow: 0 0 10px rgba(var(--c), .35); }
  #tin::placeholder { color: rgba(var(--c), .55); }

  /* captions + state label follow the core */
  #caption { position: fixed; box-sizing: border-box; width: 380px; padding: 10px 14px; border-radius: 10px; background: rgba(4, 14, 24, .78);
             border: 1px solid rgba(var(--c), .35); transition: opacity .8s; opacity: 0; pointer-events: none; }
  #caption.show { opacity: 1; }
  #cap-user { color: rgba(var(--c), .65); font-size: 13px; margin-bottom: 4px; font-style: italic; }
  #cap-ai { color: #eaffff; font-size: 16px; font-weight: 300; line-height: 1.35; }
  #corner { position: fixed; color: rgb(var(--c)); font: 11px Consolas, monospace; letter-spacing: .2em; text-transform: uppercase;
            text-shadow: 0 0 8px rgba(var(--c), .6); opacity: .85; pointer-events: none; white-space: nowrap; }
  #hint { display: block; opacity: 0; font-size: 9px; letter-spacing: .12em; margin-top: 3px; transition: opacity .3s; }
  #corner.hover #hint { opacity: .7; }
  #corner.covered { opacity: 0; }
</style>
</head>
<body>
<div id="hud">
  <canvas id="c"></canvas>
  <div id="stage">
    <div id="perf" class="panel">
      <canvas id="perfc"></canvas>
      <div id="sysline"><span id="up">UP --</span><span id="bat"></span></div>
    </div>

    <div id="player" class="panel">
      <div id="pl-top">
        <div id="pl-disc">
          <canvas id="pl-rad"></canvas>
          <div id="pl-art"><img id="pl-img" alt=""><div class="hole"></div></div>
        </div>
        <div>
          <div id="pl-label">SPOTIFY · NOW PLAYING</div>
          <div id="pl-title">Nothing playing</div>
          <div id="pl-artist">Say “play something” or open Spotify</div>
          <div id="pl-ctl">
            <div class="pbtn interactive" data-a="previous" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></div>
            <div class="pbtn big interactive" data-a="play_pause" title="Play / pause"><svg viewBox="0 0 24 24" id="pl-pp"><path d="M8 5v14l11-7z"/></svg></div>
            <div class="pbtn interactive" data-a="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></div>
          </div>
          <div id="pl-prog"><span id="pl-t0">0:00</span><div id="pl-bar"><i id="pl-fill"></i></div><span id="pl-t1">0:00</span></div>
        </div>
      </div>
      <canvas id="pl-spec"></canvas>
    </div>

    <div id="term" class="panel"><div class="ph">Terminal <span class="cnt" id="tcnt"></span></div><div id="tlines"></div>
      <div id="tprompt" class="interactive"><span>&gt;</span><input id="tin" type="text" placeholder="Type to Jarvis, press Enter (Ctrl+Alt+T)" autocomplete="off" spellcheck="false"></div></div>
  </div>

  <div id="corner"><span id="cstate"></span><span id="hint">HOLD: TALK · RIGHT-DRAG: MOVE · RIGHT-HOLD+SCROLL: SIZE</span></div>
  <div id="caption"><div id="cap-user"></div><div id="cap-ai"></div></div>
</div>
<script src="layout.js"></script>
<script src="brain.js"></script>
<script src="perf.js"></script>
<script src="viz.js"></script>
<script src="renderer.js"></script>
</body>
</html>
